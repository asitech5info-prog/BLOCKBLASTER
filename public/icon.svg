<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Royal Blue -->
    <radialGradient id="icon-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a69f5" />
      <stop offset="55%" stop-color="#194fd4" />
      <stop offset="100%" stop-color="#0e328e" />
    </radialGradient>

    <!-- Block 1: Cyan/Sky Blue Jelly -->
    <linearGradient id="block-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Block 2: Golden Amber Jelly -->
    <linearGradient id="block-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffbe3b" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>

    <!-- Block 3: Ruby Red Jelly -->
    <linearGradient id="block-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#d63031" />
    </linearGradient>

    <!-- Block 4: Emerald Green Jelly -->
    <linearGradient id="block-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#10ac84" />
    </linearGradient>

    <!-- Crown Gold -->
    <linearGradient id="crown-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-deep" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="crown-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ffd54f" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- High-Def Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#icon-bg)" stroke="rgba(255,255,255,0.35)" stroke-width="6" />

  <!-- Inner Subtle Grid Glow -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="2.5">
    <line x1="130" y1="20" x2="130" y2="492" />
    <line x1="256" y1="20" x2="256" y2="492" />
    <line x1="382" y1="20" x2="382" y2="492" />
    <line x1="20" y1="130" x2="492" y2="130" />
    <line x1="20" y1="256" x2="492" y2="256" />
    <line x1="20" y1="382" x2="492" y2="382" />
  </g>

  <!-- Big Bold 3D Puzzle Blocks Formation -->
  <g filter="url(#shadow-deep)">
    <!-- 1. Top-Left: Cyan Block -->
    <g transform="translate(100, 116)">
      <rect width="144" height="144" rx="26" fill="#0056b3" />
      <rect x="4" y="4" width="136" height="136" rx="22" fill="url(#block-cyan)" stroke="#70d6ff" stroke-width="2" />
      <!-- Bevel gloss -->
      <path d="M 12 12 L 132 12 L 116 28 L 28 28 Z" fill="rgba(255,255,255,0.8)" />
      <rect x="36" y="28" width="72" height="30" rx="15" fill="rgba(255,255,255,0.45)" />
    </g>

    <!-- 2. Top-Right: Ruby Red Block -->
    <g transform="translate(268, 116)">
      <rect width="144" height="144" rx="26" fill="#8e0e00" />
      <rect x="4" y="4" width="136" height="136" rx="22" fill="url(#block-red)" stroke="#ff6b81" stroke-width="2" />
      <path d="M 12 12 L 132 12 L 116 28 L 28 28 Z" fill="rgba(255,255,255,0.8)" />
      <rect x="36" y="28" width="72" height="30" rx="15" fill="rgba(255,255,255,0.45)" />
    </g>

    <!-- 3. Bottom-Left: Emerald Green Block -->
    <g transform="translate(100, 284)">
      <rect width="144" height="144" rx="26" fill="#1b5e20" />
      <rect x="4" y="4" width="136" height="136" rx="22" fill="url(#block-green)" stroke="#81c784" stroke-width="2" />
      <path d="M 12 12 L 132 12 L 116 28 L 28 28 Z" fill="rgba(255,255,255,0.8)" />
      <rect x="36" y="28" width="72" height="30" rx="15" fill="rgba(255,255,255,0.45)" />
    </g>

    <!-- 4. Bottom-Right: Golden Amber Block -->
    <g transform="translate(268, 284)">
      <rect width="144" height="144" rx="26" fill="#b7790b" />
      <rect x="4" y="4" width="136" height="136" rx="22" fill="url(#block-gold)" stroke="#ffe082" stroke-width="2" />
      <path d="M 12 12 L 132 12 L 116 28 L 28 28 Z" fill="rgba(255,255,255,0.85)" />
      <rect x="36" y="28" width="72" height="30" rx="15" fill="rgba(255,255,255,0.45)" />
    </g>
  </g>

  <!-- Big Sparkling Golden Crown Centerpiece (Perched dynamically on top) -->
  <g transform="translate(256, 110)" filter="url(#crown-glow)">
    <!-- Crown 3 Peaks -->
    <path d="M -90 -16 
             L -72 44 
             L 72 44 
             L 90 -16 
             L 44 10 
             L 0 -44 
             L -44 10 Z" 
          fill="url(#crown-gold)" stroke="#e67e22" stroke-width="5" stroke-linejoin="round" />
    <!-- Crown Base Band -->
    <rect x="-72" y="36" width="144" height="18" rx="9" fill="#f39c12" stroke="#d35400" stroke-width="2.5" />
    <!-- Crown White Pearl Jewels -->
    <circle cx="-90" cy="-16" r="9" fill="#ffffff" stroke="#f39c12" stroke-width="2.5" />
    <circle cx="0" cy="-44" r="12" fill="#ffffff" stroke="#f39c12" stroke-width="3" />
    <circle cx="90" cy="-16" r="9" fill="#ffffff" stroke="#f39c12" stroke-width="2.5" />
    <!-- Crown Center Gem -->
    <polygon points="0,-4 14,12 0,28 -14,12" fill="#ff3b30" stroke="#b71c1c" stroke-width="2"/>
  </g>

  <!-- Sparkling Star Glints -->
  <g fill="#ffffff">
    <!-- Top-left sparkle -->
    <path d="M 64 74 Q 78 74 78 60 Q 78 74 92 74 Q 78 74 78 88 Q 78 74 64 74 Z" opacity="0.95" />
    <!-- Bottom-right sparkle -->
    <path d="M 420 424 Q 434 424 434 410 Q 434 424 448 424 Q 434 424 434 438 Q 434 424 420 424 Z" opacity="0.95" />
  </g>
</svg>
