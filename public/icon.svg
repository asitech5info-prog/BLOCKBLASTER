<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a56db" />
      <stop offset="50%" stop-color="#0f3bb0" />
      <stop offset="100%" stop-color="#09216e" />
    </linearGradient>

    <!-- Block Gradients -->
    <linearGradient id="gem-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="gem-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="gem-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <linearGradient id="gem-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c" />
      <stop offset="100%" stop-color="#ff4b2b" />
    </linearGradient>

    <linearGradient id="gem-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b92b27" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>

    <linearGradient id="crown-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="50%" stop-color="#ffa751" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>

    <!-- Filters -->
    <filter id="block-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="crown-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ffd700" flood-opacity="0.75" />
    </filter>

    <filter id="gem-bevel">
      <feDropShadow dx="0" dy="-3" stdDeviation="0" flood-color="rgba(255,255,255,0.7)" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Squircle Base with Deep Border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#icon-bg)" stroke="rgba(255,255,255,0.22)" stroke-width="8" filter="url(#block-shadow)"/>

  <!-- Inner Soft Pattern / Light Grid Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="80" y1="0" x2="80" y2="512"/>
    <line x1="160" y1="0" x2="160" y2="512"/>
    <line x1="240" y1="0" x2="240" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="400" y1="0" x2="400" y2="512"/>
    <line x1="0" y1="80" x2="512" y2="80"/>
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="240" x2="512" y2="240"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="400" x2="512" y2="400"/>
  </g>

  <!-- 3D Beveled Puzzle Blocks Grid Container (Centrally Positioned) -->
  <g transform="translate(96, 116)" filter="url(#block-shadow)">
    <!-- 1. Top-Left: Bright Blue Block -->
    <g transform="translate(0, 0)">
      <rect width="98" height="98" rx="20" fill="#0052d4" />
      <rect x="2" y="2" width="94" height="94" rx="18" fill="url(#gem-blue)" />
      <!-- Bevel Highlights -->
      <path d="M 6 6 L 92 6 L 80 18 L 18 18 Z" fill="rgba(255,255,255,0.65)" />
      <path d="M 6 6 L 18 18 L 18 80 L 6 92 Z" fill="rgba(255,255,255,0.4)" />
      <path d="M 92 92 L 6 92 L 18 80 L 80 80 Z" fill="rgba(0,0,0,0.3)" />
      <path d="M 92 92 L 80 80 L 80 18 L 92 6 Z" fill="rgba(0,0,0,0.22)" />
      <!-- Glossy Center Pill -->
      <rect x="24" y="20" width="50" height="22" rx="11" fill="rgba(255,255,255,0.4)" />
    </g>

    <!-- 2. Top-Middle: Orange/Amber Block -->
    <g transform="translate(110, 0)">
      <rect width="98" height="98" rx="20" fill="#c0392b" />
      <rect x="2" y="2" width="94" height="94" rx="18" fill="url(#gem-orange)" />
      <path d="M 6 6 L 92 6 L 80 18 L 18 18 Z" fill="rgba(255,255,255,0.65)" />
      <path d="M 6 6 L 18 18 L 18 80 L 6 92 Z" fill="rgba(255,255,255,0.4)" />
      <path d="M 92 92 L 6 92 L 18 80 L 80 80 Z" fill="rgba(0,0,0,0.3)" />
      <path d="M 92 92 L 80 80 L 80 18 L 92 6 Z" fill="rgba(0,0,0,0.22)" />
      <rect x="24" y="20" width="50" height="22" rx="11" fill="rgba(255,255,255,0.4)" />
    </g>

    <!-- 3. Top-Right: Ruby Red / Pink Block -->
    <g transform="translate(220, 0)">
      <rect width="98" height="98" rx="20" fill="#8e0e00" />
      <rect x="2" y="2" width="94" height="94" rx="18" fill="url(#gem-pink)" />
      <path d="M 6 6 L 92 6 L 80 18 L 18 18 Z" fill="rgba(255,255,255,0.65)" />
      <path d="M 6 6 L 18 18 L 18 80 L 6 92 Z" fill="rgba(255,255,255,0.4)" />
      <path d="M 92 92 L 6 92 L 18 80 L 80 80 Z" fill="rgba(0,0,0,0.3)" />
      <path d="M 92 92 L 80 80 L 80 18 L 92 6 Z" fill="rgba(0,0,0,0.22)" />
      <rect x="24" y="20" width="50" height="22" rx="11" fill="rgba(255,255,255,0.4)" />
    </g>

    <!-- 4. Middle-Left: Emerald Green Block -->
    <g transform="translate(0, 110)">
      <rect width="98" height="98" rx="20" fill="#0b5345" />
      <rect x="2" y="2" width="94" height="94" rx="18" fill="url(#gem-cyan)" />
      <path d="M 6 6 L 92 6 L 80 18 L 18 18 Z" fill="rgba(255,255,255,0.65)" />
      <path d="M 6 6 L 18 18 L 18 80 L 6 92 Z" fill="rgba(255,255,255,0.4)" />
      <path d="M 92 92 L 6 92 L 18 80 L 80 80 Z" fill="rgba(0,0,0,0.3)" />
      <path d="M 92 92 L 80 80 L 80 18 L 92 6 Z" fill="rgba(0,0,0,0.22)" />
      <rect x="24" y="20" width="50" height="22" rx="11" fill="rgba(255,255,255,0.4)" />
    </g>

    <!-- 5. Middle-Right: Yellow Gold Block -->
    <g transform="translate(220, 110)">
      <rect width="98" height="98" rx="20" fill="#b7950b" />
      <rect x="2" y="2" width="94" height="94" rx="18" fill="url(#crown-gold)" />
      <path d="M 6 6 L 92 6 L 80 18 L 18 18 Z" fill="rgba(255,255,255,0.75)" />
      <path d="M 6 6 L 18 18 L 18 80 L 6 92 Z" fill="rgba(255,255,255,0.45)" />
      <path d="M 92 92 L 6 92 L 18 80 L 80 80 Z" fill="rgba(0,0,0,0.3)" />
      <path d="M 92 92 L 80 80 L 80 18 L 92 6 Z" fill="rgba(0,0,0,0.22)" />
      <rect x="24" y="20" width="50" height="22" rx="11" fill="rgba(255,255,255,0.45)" />
    </g>

    <!-- 6. Bottom-Middle: Bright Blue Block -->
    <g transform="translate(110, 220)">
      <rect width="98" height="98" rx="20" fill="#0052d4" />
      <rect x="2" y="2" width="94" height="94" rx="18" fill="url(#gem-blue)" />
      <path d="M 6 6 L 92 6 L 80 18 L 18 18 Z" fill="rgba(255,255,255,0.65)" />
      <path d="M 6 6 L 18 18 L 18 80 L 6 92 Z" fill="rgba(255,255,255,0.4)" />
      <path d="M 92 92 L 6 92 L 18 80 L 80 80 Z" fill="rgba(0,0,0,0.3)" />
      <path d="M 92 92 L 80 80 L 80 18 L 92 6 Z" fill="rgba(0,0,0,0.22)" />
      <rect x="24" y="20" width="50" height="22" rx="11" fill="rgba(255,255,255,0.4)" />
    </g>
  </g>

  <!-- Crown Ornament on Top -->
  <g transform="translate(256, 102)" filter="url(#crown-glow)">
    <!-- Golden 3-Peak Crown with Pearl Jewels -->
    <path d="M -75 -10 
             L -62 38 
             L 62 38 
             L 75 -10 
             L 36 10 
             L 0 -36 
             L -36 10 Z" 
          fill="url(#crown-gold)" stroke="#ff8c00" stroke-width="4" stroke-linejoin="round" />
    <!-- Crown Base Band -->
    <rect x="-62" y="32" width="124" height="14" rx="7" fill="#f39c12" stroke="#d35400" stroke-width="2"/>
    <!-- Crown Jewels -->
    <circle cx="-75" cy="-10" r="7" fill="#ffffff" stroke="#f39c12" stroke-width="2" />
    <circle cx="0" cy="-36" r="9" fill="#ffffff" stroke="#f39c12" stroke-width="2.5" />
    <circle cx="75" cy="-10" r="7" fill="#ffffff" stroke="#f39c12" stroke-width="2" />
    <!-- Ruby in Center of Crown -->
    <polygon points="0,0 10,14 0,26 -10,14" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  </g>

  <!-- Sparkles / Blast Stars -->
  <g fill="#ffffff">
    <!-- Top Left Sparkle -->
    <path d="M 68 85 Q 78 85 78 75 Q 78 85 88 85 Q 78 85 78 95 Q 78 85 68 85 Z" opacity="0.9"/>
    <!-- Bottom Right Sparkle -->
    <path d="M 425 410 Q 437 410 437 398 Q 437 410 449 410 Q 437 410 437 422 Q 437 410 425 410 Z" opacity="0.95"/>
    <circle cx="410" cy="110" r="5" opacity="0.8" />
    <circle cx="95" cy="385" r="4" opacity="0.75" />
  </g>
</svg>
