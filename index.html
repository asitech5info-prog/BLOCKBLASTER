<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="Block Blaster - The ultimate block puzzle blast game for Web, iOS, and Android!" />
    <title>Block Blaster - Block Puzzle Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" class="game-wrapper">
      <!-- Background Ambient Glows -->
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>

      <!-- Game Header -->
      <header class="game-header">
        <div class="logo-title">
          <span class="logo-text">BLOCK<span class="highlight">BLASTER</span></span>
        </div>

        <div class="header-actions">
          <button id="sound-btn" class="icon-btn" aria-label="Toggle Sound" title="Sound On/Off">
            <span class="icon sound-icon">🔊</span>
          </button>
          <button id="theme-btn" class="icon-btn" aria-label="Restart Game" title="Restart">
            <span class="icon">🔄</span>
          </button>
        </div>
      </header>

      <!-- Scoreboard Bar -->
      <div class="score-container">
        <div class="score-card current-score-card">
          <span class="score-label">SCORE</span>
          <span id="current-score" class="score-val" data-testid="current-score">0</span>
        </div>

        <div class="combo-badge-wrapper">
          <div id="combo-badge" class="combo-badge hidden">
            <span class="combo-fire">🔥</span>
            <span id="combo-text">COMBO x2</span>
          </div>
        </div>

        <div class="score-card best-score-card">
          <span class="score-label">BEST 👑</span>
          <span id="best-score" class="score-val" data-testid="best-score">0</span>
        </div>
      </div>

      <!-- Main Game Board (8x8) -->
      <main class="board-container">
        <div id="game-board" class="board" data-testid="game-board">
          <!-- 64 cells generated by JS -->
        </div>

        <!-- Floating Points Effect Container -->
        <div id="floater-container" class="floater-layer"></div>
      </main>

      <!-- Bottom Tray for 3 Shapes -->
      <footer class="tray-container">
        <div id="shapes-tray" class="shapes-tray" data-testid="shapes-tray">
          <div class="tray-slot" data-slot="0"></div>
          <div class="tray-slot" data-slot="1"></div>
          <div class="tray-slot" data-slot="2"></div>
        </div>
      </footer>

      <!-- Game Over Modal -->
      <div id="game-over-modal" class="modal-overlay hidden" data-testid="game-over-modal">
        <div class="modal-card">
          <div class="modal-header">
            <span class="game-over-emoji">💥</span>
            <h2 class="modal-title">NO MORE MOVES!</h2>
          </div>
          <div class="modal-body">
            <div class="final-score-box">
              <span class="final-score-title">FINAL SCORE</span>
              <span id="modal-final-score" class="final-score-num">0</span>
            </div>
            <div id="new-high-score-banner" class="new-high-score hidden">
              🎉 NEW HIGH SCORE! 🎉
            </div>
          </div>
          <div class="modal-footer">
            <button id="modal-restart-btn" class="play-again-btn" data-testid="play-again-btn">
              <span>PLAY AGAIN</span>
              <span class="btn-arrow">➔</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Dragging Avatar Clone (Fixed on viewport during drag) -->
      <div id="drag-avatar" class="drag-avatar hidden"></div>
    </div>

    <!-- Canvas for Confetti -->
    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
