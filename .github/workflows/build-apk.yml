name: Build Block Blaster APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Package
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BlockBlaster-v1.0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlaster-v1.0.1
          path: BlockBlaster-v1.0.1.apk
          retention-days: 30

      - name: Publish GitHub Release v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.1 --yes || true
          gh release create v1.0.1 BlockBlaster-v1.0.1.apk \
            --title "Block Blaster v1.0.1" \
            --notes "### Block Blaster v1.0.1 Release
          - Authentic score presenter & dynamic themes on board clear
          - 5-second countdown timer on game over before retry unlocks
          - State persistence (resume exact game where left off)
          - Full-screen Adventure mode with 96-level silhouette
          - Achievements & Octagonal Medals
          - More Settings with Contact Us (asitech5info@gmail.com) & Privacy Policy
          - Added 2x3, 3x2, and 3x3 blocks" || true

