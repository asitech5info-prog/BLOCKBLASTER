name: Build Block Blaster APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Package
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BlockBlaster-v1.0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlaster-v1.0.1
          path: BlockBlaster-v1.0.1.apk
          retention-days: 30

      - name: Publish GitHub Release v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.1 --yes || true
          gh release create v1.0.1 BlockBlaster-v1.0.1.apk \
            --title "Block Blaster v1.0.1 (Fixed)" \
            --notes "### Block Blaster v1.0.1 (Fixed)
          - Full-screen immersion optimized for Pixel 8 & all device dimensions
          - Smooth 60fps drag & drop with accurate placement & zero lag
          - High score starts at 0 and grows dynamically by playing
          - Dynamic Medals and Milestone system with real goals
          - Adventure mode level saving persistence (Level 1 -> Level 2 auto progression)
          - Authentic UI matching reference screenshots (Royal Blue theme, 3D Block Blast logo)
          - White location pin logo for Adventure, white infinity logo for Classic
          - In-game settings includes Exit to Home button (hidden in home settings)
          - Crystal-clear, razor-sharp app icon across all Android mipmap resolutions
          - 96-level silhouette adventure map & handcrafted gem puzzles" || true
